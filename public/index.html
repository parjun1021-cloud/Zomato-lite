<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zomato Lite</title>
<style>
  :root {
    --red: #e23744; --ink: #1c1c1c; --muted: #696969; --line: #e8e8e8;
    --bg: #f8f8f8; --card: #fff; --star-off: #d4d4d4; --star-on: #f5a623;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .app { max-width: 480px; margin: 0 auto; min-height: 100vh; background: var(--bg); }
  header { background: var(--red); color: #fff; padding: 16px; position: sticky; top: 0; z-index: 5;
    display: flex; align-items: center; gap: 12px; }
  header h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .2px; }
  header button { background: none; border: 0; color: #fff; font-size: 24px; cursor: pointer; padding: 0 4px; line-height: 1; }
  main { padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .restaurant { cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
  .restaurant:hover { border-color: #ccc; }
  .restaurant h2 { margin: 0 0 4px; font-size: 17px; }
  .meta { color: var(--muted); font-size: 14px; margin: 2px 0; }
  .badge { align-self: flex-start; background: #24963f; color: #fff; border-radius: 8px;
    padding: 4px 8px; font-weight: 700; font-size: 14px; white-space: nowrap; }
  .badge.none { background: #9a9a9a; }
  .count { text-align: center; color: var(--muted); font-size: 11px; margin-top: 4px; }
  .summary { text-align: center; }
  .summary .big { font-size: 42px; font-weight: 700; margin: 4px 0 0; }
  .stars-static { font-size: 22px; letter-spacing: 2px; color: var(--star-off); }
  .stars-static .on { color: var(--star-on); }
  h3 { margin: 20px 0 10px; font-size: 16px; }
  .picker { display: flex; justify-content: center; gap: 6px; margin: 8px 0 12px; }
  .picker button { background: none; border: 0; font-size: 40px; line-height: 1; cursor: pointer; color: var(--star-off); padding: 0 2px; }
  .picker button.on { color: var(--star-on); }
  textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: inherit; resize: vertical; min-height: 70px; }
  .submit { width: 100%; margin-top: 10px; background: var(--red); color: #fff; border: 0; border-radius: 8px;
    padding: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
  .submit:disabled { background: #e9a0a6; cursor: not-allowed; }
  .msg { margin-top: 8px; font-size: 14px; min-height: 18px; text-align: center; }
  .msg.err { color: #c62828; }
  .msg.ok { color: #24963f; }
  .review-top { display: flex; justify-content: space-between; align-items: center; }
  .review .stars-static { font-size: 16px; }
  .review time { color: var(--muted); font-size: 12px; }
  .review p { margin: 6px 0 0; }
  .empty { text-align: center; color: var(--muted); padding: 24px 0; }
</style>
</head>
<body>
<div class="app">
  <header>
    <button id="back" aria-label="Back" hidden>&#8592;</button>
    <h1 id="title">Zomato Lite</h1>
  </header>
  <main id="view"></main>
</div>

<script>
  const view = document.getElementById('view');
  const title = document.getElementById('title');
  const back = document.getElementById('back');

  let restaurants = [];
  let pickedRating = 0;

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const starsHtml = (n) => {
    const filled = Math.round(n);
    return '<span class="stars-static">' +
      [1,2,3,4,5].map((i) => `<span class="${i <= filled ? 'on' : ''}">&#9733;</span>`).join('') + '</span>';
  };
  const fmtDate = (iso) => new Date(iso).toLocaleString('en-IN', {
    day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true,
  });

  async function load() {
    const res = await fetch('/api/restaurants');
    restaurants = (await res.json()).restaurants;
  }

  // ---------- Screen 1: restaurant list ----------
  function renderList() {
    title.textContent = 'Zomato Lite';
    back.hidden = true;
    view.innerHTML = restaurants.map((r) => `
      <div class="card restaurant" data-id="${r.id}">
        <div>
          <h2>${esc(r.name)}</h2>
          <div class="meta">${esc(r.cuisine)} &middot; ${esc(r.type)}</div>
          <div class="meta">${esc(r.address)}</div>
        </div>
        <div>
          <div class="badge ${r.review_count ? '' : 'none'}">${r.average_rating.toFixed(1)} &#9733;</div>
          <div class="count">${r.review_count} review${r.review_count === 1 ? '' : 's'}</div>
        </div>
      </div>`).join('') || '<div class="empty">No restaurants yet.</div>';
    view.querySelectorAll('.restaurant').forEach((el) =>
      el.addEventListener('click', () => { location.hash = '#/restaurant/' + el.dataset.id; }));
  }

  // ---------- Screen 2: rate + reviews ----------
  function renderDetail(id) {
    const r = restaurants.find((x) => x.id === id);
    if (!r) { location.hash = '#/'; return; }
    title.textContent = r.name;
    back.hidden = false;
    pickedRating = 0;

    view.innerHTML = `
      <div class="card summary">
        <div class="meta">${esc(r.cuisine)} &middot; ${esc(r.type)} &middot; ${esc(r.address)}</div>
        <div class="big" id="avg">${r.average_rating.toFixed(1)}</div>
        <div id="avgStars">${starsHtml(r.average_rating)}</div>
        <div class="meta" id="cnt">${r.review_count} review${r.review_count === 1 ? '' : 's'}</div>
      </div>

      <div class="card">
        <strong>Rate this restaurant</strong>
        <div class="picker" id="picker">
          ${[1,2,3,4,5].map((i) => `<button type="button" data-v="${i}" aria-label="${i} star">&#9733;</button>`).join('')}
        </div>
        <textarea id="comment" maxlength="500" placeholder="Write a comment (optional)"></textarea>
        <button class="submit" id="submit" disabled>Submit review</button>
        <div class="msg" id="msg"></div>
      </div>

      <h3>All reviews</h3>
      <div id="reviews"></div>`;

    renderReviews(r);

    const picker = document.getElementById('picker');
    const submit = document.getElementById('submit');
    picker.querySelectorAll('button').forEach((b) => b.addEventListener('click', () => {
      pickedRating = Number(b.dataset.v);
      picker.querySelectorAll('button').forEach((x) => x.classList.toggle('on', Number(x.dataset.v) <= pickedRating));
      submit.disabled = false;
    }));

    submit.addEventListener('click', async () => {
      const msg = document.getElementById('msg');
      submit.disabled = true;
      msg.className = 'msg'; msg.textContent = 'Submitting...';
      try {
        const res = await fetch('/api/reviews', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            restaurant_id: r.id,
            rating: pickedRating,
            comment: document.getElementById('comment').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not submit');
        await load();
        renderDetail(id);
        const m = document.getElementById('msg');
        m.className = 'msg ok'; m.textContent = 'Thanks! Your review was added.';
      } catch (e) {
        msg.className = 'msg err'; msg.textContent = e.message;
        submit.disabled = false;
      }
    });
  }

  function renderReviews(r) {
    document.getElementById('reviews').innerHTML = r.reviews.length
      ? r.reviews.map((rv) => `
          <div class="card review">
            <div class="review-top">${starsHtml(rv.rating)}<time datetime="${rv.created_at}">${fmtDate(rv.created_at)}</time></div>
            ${rv.comment ? `<p>${esc(rv.comment)}</p>` : ''}
          </div>`).join('')
      : '<div class="empty">No reviews yet. Be the first to rate!</div>';
  }

  // ---------- tiny router ----------
  async function route() {
    const m = location.hash.match(/^#\/restaurant\/(\d+)$/);
    await load();
    if (m) renderDetail(Number(m[1])); else renderList();
  }
  back.addEventListener('click', () => { location.hash = '#/'; });
  window.addEventListener('hashchange', route);
  route();
</script>
</body>
</html>
